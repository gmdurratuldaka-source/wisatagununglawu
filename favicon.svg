<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="mountGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="snowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <!-- Sun -->
  <circle cx="360" cy="160" r="55" fill="url(#sunGrad)" />
  <!-- Back Mountain -->
  <path d="M 120 400 L 260 180 L 400 400 Z" fill="#047857" opacity="0.7" />
  <!-- Front Mountain -->
  <path d="M 40 400 L 210 140 L 470 400 Z" fill="url(#mountGrad)" />
  <!-- Snow Cap Front Mountain -->
  <path d="M 210 140 L 245 195 L 225 210 L 210 198 L 195 210 L 175 195 Z" fill="url(#snowGrad)" />
